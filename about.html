<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <style>
            .accordian{
                background-color: #eee;
                color: #444;
                cursor: pointer;
                padding: 18px;
                width:100%;
                border: none;
                text-align: left;
                outline: none;
                font-size: 15px;
                transition: 0.4s;

            }
            .active,.accordian:hover{
                background-color: #ccc;

            }
            .panel{
                padding: 0 18px;
                display: block;
                background-color: white;
                overflow: hidden;
            }

        </style>
    </head>
    <body>
        <h2>Overview</h2>
        <button class="Overview">Section1</button>
        <h2>Overview</h2>
        <button class="overview-button">Section1</button>
        <div class="panel" style="display: none;">

                Our app connects farmers directly with buyers, 
                streamlining the process of selling produce and ensuring better market access.
                Our mission is to empower farmers by providing a user-friendly platform that maximizes their reach and profitability.
            </p>
        </div>
        <h2>features</h2>

            <p>

            </p>
        </div>
        <h2>accordian</h2>
        <button class="accordian">Section1</button>

            <p>

            </p>
        </div>
        <script>
            var acc=document.getElementsByClassName("click",function(){
                this.classList.toggle("active");
                var panel=this.nextElementSibling;
                if(panel.style.display==="block"){
                    panel.style.display==="none";
                }
                else{
                    panel.style.display="block";
                }
            });
        
        </script>
    </body>
</html>
