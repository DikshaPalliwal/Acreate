<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Create Your Account</h2>
        <form action="/submit_registration" method="POST">
            <div class="form-group">
                <label for="user-type">I am a</label>
                <select id="user-type" name="user-type" required>
                    <option value="farmer">Farmer</option>
                    <option value="buyer">Buyer</option>
                </select>
            </div>
            
            <div id="farmer-fields" class="additional-fields">
                <div class="form-group">
                    <label for="farm-name">Farm Name</label>
                    <input type="text" id="farm-name" name="farm-name">
                </div>
                <div class="form-group">
                    <label for="farm-type">Type of Farm</label>
                    <input type="text" id="farm-type" name="farm-type">
                </div>
            </div>
            
            <div id="buyer-fields" class="additional-fields">
                <div class="form-group">
                    <label for="business-name">Business Name</label>
                    <input type="text" id="business-name" name="business-name">
                </div>
                <div class="form-group">
                    <label for="business-type">Type of Business</label>
                    <input type="text" id="business-type" name="business-type">
                </div>
            </div>
            
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" required>
            </div>
            <div class="form-group">
                <button type="submit">Create Account</button>
            </div>
        </form>
        <p class="login-link">Already have an account? <a href="/login">Log in</a></p>
    </div>

    <script>
        document.getElementById('user-type').addEventListener('change', function() {
            var userType = this.value;
            document.querySelectorAll('.additional-fields').forEach(function(fieldSet) {
                fieldSet.style.display = 'none';
            });
            if (userType === 'farmer') {
                document.getElementById('farmer-fields').style.display = 'block';
            } else {
                document.getElementById('buyer-fields').style.display = 'block';
            }
        });

        // Initialize the form to show the correct fields
        document.getElementById('user-type').dispatchEvent(new Event('change'));
    </script>
</body>
</html>
